[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlinf-lingbotvla"
version = "0.1.0"
description = "Pinned LingBot-VLA inference runtime maintained by RLinf"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Robbyant Team"},
    {name = "RLinf Contributors"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
]
# NOTE: ``lerobot==0.4.2`` is a runtime requirement but is intentionally NOT
# listed here as a normal dependency. Phase 6 confirmed it *cannot* be one:
# lerobot pins ``datasets>=4.0,<4.2`` and ``gymnasium>=1.1.1``, which are
# structural conflicts with the RoboTwin runtime pins below (``datasets==3.6.0``,
# ``gymnasium==0.29.1``) — the RoboTwin/LingBot inference runtime deliberately
# stays on the older versions, and lerobot's dataset/training code (the only
# caller of datasets>=4 / gymnasium>=1.1) is not on the inference path. lerobot's
# ``torch>=2.2.1,<2.8.0`` pin IS satisfied by ``torch==2.7.1`` (Phase 5), but the
# datasets/gymnasium conflict alone keeps lerobot on ``--no-deps``.
#
# lerobot is therefore installed with ``--no-deps`` by ``install.sh``, after
# which ``scripts/apply_lerobot_slim.py`` reapplies the three load-bearing
# import-slimming overrides shipped in ``patches/lerobot_slim/``. The slim files
# remove lerobot's hardware-dep import chain, so ``--no-deps`` is safe for
# inference.
#
# Phase 6 classified lerobot's deps by real inference import trace (construct
# LingbotVLAServer + run one infer, then inspect sys.modules). The subset lerobot
# imports on the *inference* path — and which LingBot does not already declare
# transitively — is declared explicitly below: ``accelerate``, ``simplejson``,
# ``xxhash``. Verified absent on the inference path (and therefore NOT declared):
# ``jsonlines``, ``deepdiff``, ``h5py`` (lerobot only imports these from its
# dataset/eval/training modules, which the slim bypasses). ``torchcodec`` is
# data-path only (``lingbotvla/data/``) and moved to the ``[train]`` extra.
# Golden baseline consistency: the Golden venv carries accelerate/simplejson/
# xxhash and lacks jsonlines/deepdiff/h5py, matching this classification.
# See ``patches/lerobot_slim/README.md``.
dependencies = [
    "accelerate>=1.10.0,<2.0.0",
    "av>=14.2.0",
    "blobfile>=3.0.0",
    "datasets==3.6.0",
    "diffusers==0.30.3",
    "draccus==0.10.0",
    "einops>=0.8.0",
    "gymnasium==0.29.1",
    "huggingface-hub[cli]>=0.34,<1.0",
    "matplotlib",
    "msgpack",
    "numpy==1.26.4",
    "numpydantic",
    "omegaconf>=2.3.0",
    "packaging>=24.2",
    "pillow>=10",
    "pyyaml",
    "safetensors",
    "simplejson>=3.19",
    "tensorboard==2.16.2",
    "termcolor>=2.4.0",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchdata>=0.8.0,<1.0",
    "torchvision==0.22.1",
    "tqdm",
    "transformers==4.51.3",
    "websockets",
    "xxhash>=3.0",
]

[project.optional-dependencies]
# torchcodec is data-path only (lingbotvla/data/vla_data/base_dataset.py) and is
# not imported on the deploy/inference path (confirmed by Phase 6 import trace).
# It is therefore opt-in for training/dataset builds rather than a core runtime dep.
train = [
    "torchcodec==0.5",
]

[project.urls]
Homepage = "https://github.com/RLinf/lingbot-vla"
Repository = "https://github.com/RLinf/lingbot-vla"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["deploy*", "lingbotvla*"]
exclude = ["scripts*", "tasks*", "tests*"]

[tool.ruff]
target-version = "py311"
line-length = 119
indent-width = 4

[tool.ruff.lint]
ignore = ["C901", "E501", "E741", "W605", "C408"]
select = ["C", "E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["lingbotvla"]
known-third-party = ["torch", "transformers", "wandb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
